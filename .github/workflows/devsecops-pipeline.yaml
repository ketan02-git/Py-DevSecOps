name: DevSecOps Python Flask Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

env:
  IMAGE_NAME: cloudketan/python
  IMAGE_TAG: "p1"

jobs:
  devsecops-pipeline:
    runs-on: self-hosted
    steps:

      # =========================
      # 1️⃣ Checkout code
      # =========================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      # =========================
      # 2️⃣ Clean temp files
      # =========================
      - name: Clean temporary files
        run: |
          sudo rm -rf /tmp/gitleaks* 
          sudo rm -rf /tmp/*

      # =========================
      # 3️⃣ Python setup & dependencies
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # =========================
      # 4️⃣ Gitleaks (secret scanning)
      # =========================
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2

      # =========================
      # 5️⃣ SonarQube Scan (SAST)
      # =========================
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=python-app
            -Dsonar.sources=.
            -Dsonar.language=py

      # =========================
      # 6️⃣ OWASP Dependency Check (SCA)
      # =========================
      - name: Clean old Dependency-Check DB
        run: rm -rf ./dependency-check/*

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "python-app"
          path: "."
          format: "HTML"
          out: ${{ runner.temp }}/dependency-check
          args: >
            --noupdate false

      # =========================
      # 7️⃣ Docker Login & Build
      # =========================
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Build
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      # =========================
      # 8️⃣ Docker Push
      # =========================
      - name: Docker Push
        run: docker push $IMAGE_NAME:$IMAGE_TAG

      # =========================
      # 9️⃣ Kubernetes Deploy
      # =========================
      - name: Deploy to Kubernetes
        run: kubectl apply -f py-argocd.yaml
