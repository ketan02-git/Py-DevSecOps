name: DevSecOps Python Flask Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

env:
  IMAGE_NAME: cloudketan/python
  IMAGE_TAG: ${{ github.sha }}

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-24.04
    steps:

      # =========================
      # 0️⃣ Docker cleanup (free space)
      # =========================
      - name: Docker Cleanup
        run: sudo docker system prune -a --volumes --force || true

      # =========================
      # 1️⃣ Checkout Code
      # =========================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # 2️⃣ Clean temp files
      # =========================
      - name: Clean temporary files
        run: |
          sudo rm -rf /tmp/gitleaks* 
          sudo rm -rf /tmp/*

      # =========================
      # 3️⃣ Python setup & dependencies
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # =========================
      # 4️⃣ Gitleaks Scan
      # =========================
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2

      # # =========================
      # # 5️⃣ SonarQube Scan (NO Docker)
      # # =========================
      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v7.0.0   # latest stable
      #   with:
      #     args: >
      #       -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
      #       -Dsonar.sources=.
      #       -Dsonar.login=${{ secrets.SONAR_TOKEN }}
      #       -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
      #       # Add any additional sonar properties here
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # =========================
      # 6️⃣ OWASP Dependency Check (CLI only)
      # =========================
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "python-app"
          path: "."
          format: HTML
          out: "dependency-check-reports"
          args: --failOnCVSS 7 --enableRetired

      # # =========================
      # # 7️⃣ Docker Login, Build & Push
      # # =========================
