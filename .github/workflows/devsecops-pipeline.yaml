name: DevSecOps Python Flask Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

env:
  IMAGE_NAME: cloudketan/python
  IMAGE_TAG: ${{ github.sha }}

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-24.04
    steps:
    
      - name: Docker Cleanup
        run: sudo docker system prune -a --volumes --force || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean temporary files
        run: |
          sudo rm -rf /tmp/gitleaks* 
          sudo rm -rf /tmp/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=python-app
            -Dsonar.sources=.
            -Dsonar.language=py

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Build
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Clean old Dependency-Check DB
        run: rm -rf ./dependency-check/*

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "python-app"
          path: "."
          format: "HTML"
          out: ${{ runner.temp }}/dependency-check
          args: >
            --noupdate false

      - name: Docker Push
        run: docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Deploy to Kubernetes
        run: kubectl apply -f py-argocd.yaml
