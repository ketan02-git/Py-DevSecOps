name: DevSecOps Python Flask Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

env:
  IMAGE_NAME: cloudketan/python
  IMAGE_TAG: ${{ github.sha }}

jobs:
  devsecops-pipeline:
    runs-on: self-hosted
    steps:

      # =========================
      # 0️⃣ Docker cleanup (free space)
      # =========================
      - name: Docker Cleanup
        run: sudo docker system prune -a --volumes --force || true

      # =========================
      # 1️⃣ Checkout Code
      # =========================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # 2️⃣ Clean temp files
      # =========================
      - name: Clean temporary files
        run: |
          sudo rm -rf /tmp/gitleaks* 
          sudo rm -rf /tmp/*

      # =========================
      # 3️⃣ Python setup & dependencies
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # =========================
      # 4️⃣ Gitleaks Scan
      # =========================
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2

      # =========================
      # 5️⃣ SonarQube Scan
      # =========================
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=python-app
            -Dsonar.sources=.
            -Dsonar.language=py

      # =========================
      # 6️⃣ OWASP Dependency Check (CLI only)
      # =========================
      - name: OWASP Dependency Check (CLI)
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v8.4.1/dependency-check-8.4.1-release.zip
          unzip dependency-check-8.4.1-release.zip
          ./dependency-check/bin/dependency-check.sh --project "python-app" --scan . --format HTML --out ${{ runner.temp }}/dependency-check

      # =========================
      # 7️⃣ Docker Login, Build & Push
      # =========================
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Build
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Docker Push
        run: docker push $IMAGE_NAME:$IMAGE_TAG

      # =========================
      # 8️⃣ Kubernetes Deploy
      # =========================
      - name: Deploy to Kubernetes
        run: kubectl apply -f py-argocd.yaml
